<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Log In | Binance - School Project</title>
	<link rel="icon" type="image/svg+xml" href="slike/favicon.svg">
	<link rel="stylesheet" href="css/vendor/sweetalert2.min.css">
	<link rel="stylesheet" href="css/style.css">
	<script src="javascript/vendor/sweetalert2.min.js" defer></script>
	<script src="javascript/skupno.js" defer></script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<main class="page">
		<div class="login-wrapper">
			<div class="login-box">
				<div class="logo-box">
					<button class="logo-button" type="button" onclick="prikaziAvtorje()" aria-label="O projektu" title="O projektu">
						<img src="slike/Logo.png" alt="Binance" width="140" height="28">
					</button>
				</div>
				<div class="text-qr">
					<h1>Log in</h1>
					<button class="qr-button" type="button" popovertarget="qr-popup" aria-label="Show QR code" title="Show QR code">
						<img src="slike/qr-code.svg" alt="" width="28" height="28">
					</button>
				</div>
				<form class="login-form" action="html/verification.html">
					<div class="input-box">
						<label for="username">Email/Phone number</label>
						<input type="email" id="username" placeholder="Email/Phone (without country code)" maxlength="30" pattern="test@gmail[.]com" autocomplete="off" spellcheck="false" required>
					</div>
					<button type="submit" class="login-button">
						Log In
					</button>
					<div class="divider">
						<div class="divider-line"></div>
						<span>or</span>
						<div class="divider-line"></div>
					</div>
				</form>
				<div class="social-buttons">
					<button type="button" class="social-button" popovertarget="demo-info">
						<img class="light-icon" src="slike/passkey.png" alt="" width="20" height="20">
						<span>Continue with Passkey</span>
					</button>
					<button type="button" class="social-button" popovertarget="demo-info">
						<img src="slike/google.svg" alt="" width="16" height="16">
						<span>Continue with Google</span>
					</button>
					<button type="button" class="social-button" popovertarget="demo-info">
						<img src="slike/apple.svg" alt="" width="16" height="16">
						<span>Continue with Apple</span>
					</button>
					<button type="button" class="social-button" popovertarget="demo-info">
						<img src="slike/telegram.svg" alt="" width="16" height="16">
						<span>Continue with Telegram</span>
					</button>
				</div>
			</div>
			<a class="register-txt" href="html/register.html">Create a Binance Account</a>
			<a class="login-help" href="html/forgot-account.html">Can't log in?</a>
		</div>
	</main>
	<footer class="page-footer">
		<div class="footer-links">
			<button class="language-button" type="button" popovertarget="demo-info">
				<img src="slike/globe.svg" alt="" width="16" height="16"> English
			</button>
			<button type="button" popovertarget="demo-info">Cookies</button>
			<button type="button" popovertarget="demo-info">Privacy</button>
		</div>
	</footer>
	<aside class="demo-info qr-popup" id="qr-popup" popover lang="sl" aria-label="QR-koda">
		<img src="slike/tomaz_stefancic_qr.png" alt="Instagram QR-koda za TOMAZ_STEFANCIC" width="2350" height="2700">
		<button type="button" popovertarget="qr-popup" popovertargetaction="hide">Zapri</button>
	</aside>
	<aside class="demo-info" id="demo-info" popover lang="sl" aria-labelledby="demo-title">
		<h2 id="demo-title">Samo za prikaz</h2>
		<p>Ta del ne deluje zares. Stran je za šolsko nalogo, podatkov ne pošlje ali shrani.</p>
		<button type="button" popovertarget="demo-info" popovertargetaction="hide">Zapri</button>
	</aside>
</body>
</html>
