<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - Create Password | Binance - School Project</title>
	<link rel="icon" type="image/svg+xml" href="../slike/favicon.svg">
	<link rel="stylesheet" href="../css/vendor/sweetalert2.min.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/verification.css">
	<link rel="stylesheet" href="../css/register.css">
	<script src="../javascript/vendor/sweetalert2.min.js" defer></script>
	<script src="../javascript/skupno.js" defer></script>
	<script src="../javascript/register.js" defer></script>
</head>
<body class="register-progress">
	<main class="page">
		<div class="login-wrapper">
			<section class="login-box register-box" aria-labelledby="register-title">
				<div class="logo-box">
					<button class="logo-button" type="button" onclick="prikaziAvtorje()" aria-label="O projektu" title="O projektu">
						<img src="../slike/Logo.png" alt="Binance" width="140" height="28">
					</button>
				</div>
				<h1 id="register-title">Create a password</h1>
				<form onsubmit="return preveriRegisterGeslo()">
					<div class="input-box">
						<label for="register-password">Password</label>
						<input id="register-password" type="password" minlength="8" maxlength="30" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,30}" placeholder="Enter password" autocomplete="off" aria-describedby="password-rules register-password-error" oninput="pocistiRegisterNapako('register-password')" required>
					</div>
					<label class="show-password"><input type="checkbox" id="show-password" onchange="pokaziGeslo()"> Show password</label>
					<p class="code-note" id="password-rules">8-30 characters, at least 1 uppercase letter and 1 number.</p>
					<p class="code-error" id="register-password-error" role="alert"></p>
					<button class="register-button" type="submit">Next</button>
				</form>
				<a class="step-back" href="register-code.html">Back</a>
			</section>
			<a class="register-txt" href="index.html">Back to Log In</a>
		</div>
	</main>
	<footer class="page-footer">
		<div class="footer-links">
			<button class="language-button" type="button" popovertarget="demo-info"><img src="../slike/globe.svg" alt="" width="16" height="16"> English</button>
			<button type="button" popovertarget="demo-info">Cookies</button>
			<button type="button" popovertarget="demo-info">Privacy</button>
		</div>
	</footer>
	<aside class="demo-info" id="demo-info" popover lang="sl" aria-labelledby="demo-title">
		<h2 id="demo-title">Samo za prikaz</h2>
		<p>To je šolski primer. Uporabi testno geslo Binance67!, ne svojega pravega gesla. Geslo se ne shrani.</p>
		<button type="button" popovertarget="demo-info" popovertargetaction="hide">Zapri</button>
	</aside>
</body>
</html>
