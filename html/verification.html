<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Email Verification | Binance - School Project</title>
	<link rel="icon" type="image/svg+xml" href="../slike/favicon.svg">
	<link rel="stylesheet" href="../css/vendor/sweetalert2.min.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/verification.css">
	<script src="../javascript/vendor/sweetalert2.min.js" defer></script>
	<script src="../javascript/skupno.js" defer></script>
	<script src="../javascript/verification.js" defer></script>
</head>
<body>
	<main class="page">
		<div class="login-wrapper">
			<section class="login-box verification-box" aria-label="Email verification demo">
				<div class="logo-box">
					<button class="logo-button" type="button" onclick="prikaziAvtorje()" aria-label="O projektu" title="O projektu">
						<img src="../slike/Logo.png" alt="Binance" width="140" height="28">
					</button>
				</div>

				<div id="verification-step">
					<h1>Email Verification</h1>
					<p class="verification-description">Enter the 6-digit test code for <strong>test@gmail.com</strong>.</p>

					<form class="verification-form" id="verification-form" onsubmit="return preveriKodo()">
						<div class="input-box">
							<label for="verification-code">Email Verification Code</label>
							<div class="code-entry">
								<input id="verification-code" type="text" inputmode="numeric" autocomplete="off" placeholder="6-digit code" minlength="6" maxlength="6" pattern="[0-9]{6}" title="Enter six digits" aria-describedby="code-error" oninput="pocistiNapako()" required>
								<button class="get-code" type="button" popovertarget="demo-info">Get Code</button>
							</div>
						</div>
						<p class="code-error" id="code-error" role="alert"></p>
						<button class="login-button" type="submit">Submit</button>
					</form>

					<button class="code-help" type="button" popovertarget="demo-info">Didn't receive the code?</button>
				</div>

				<div id="verification-success" hidden>
					<h1 id="success-title" tabindex="-1">Verification complete</h1>
					<p class="verification-description">The code is correct. That's it!</p>
				</div>
			</section>
			<a class="register-txt" href="../index.html">Back to Log In</a>
		</div>
	</main>

	<footer class="page-footer">
		<div class="footer-links">
			<button class="language-button" type="button" popovertarget="demo-info">
				<img src="../slike/globe.svg" alt="" width="16" height="16"> English
			</button>
			<button type="button" popovertarget="demo-info">Cookies</button>
			<button type="button" popovertarget="demo-info">Privacy</button>
		</div>
	</footer>

	<aside class="demo-info" id="demo-info" popover lang="sl" aria-labelledby="demo-title">
		<h2 id="demo-title">Testna koda: 123456</h2>
		<p>Uporabi 123456. To je samo preizkus, zato ne dobiš e-pošte. Koda se ne shrani.</p>
		<button type="button" popovertarget="demo-info" popovertargetaction="hide">Zapri</button>
	</aside>
</body>
</html>
