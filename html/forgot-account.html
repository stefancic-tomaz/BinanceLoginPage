<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Can't Log In | Binance - School Project</title>
	<link rel="icon" type="image/svg+xml" href="../slike/favicon.svg">
	<link rel="stylesheet" href="../css/vendor/sweetalert2.min.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/forgot-account.css">
	<script src="../javascript/vendor/sweetalert2.min.js" defer></script>
	<script src="../javascript/skupno.js" defer></script>
</head>
<body>
	<main class="page">
		<div class="login-wrapper">
			<section class="login-box help-box" aria-labelledby="help-title">
				<div class="logo-box">
					<button class="logo-button" type="button" onclick="prikaziAvtorje()" aria-label="O projektu" title="O projektu">
						<img src="../slike/Logo.png" alt="Binance" width="140" height="28">
					</button>
				</div>

				<h1 id="help-title">Need help to log in?</h1>

				<div class="recovery-options">
					<button class="recovery-option" type="button" popovertarget="demo-info" aria-labelledby="remember-title" aria-describedby="remember-description">
						<span class="option-text">
							<span class="option-title" id="remember-title">I Remember My Account</span>
							<span class="option-description" id="remember-description">Click here to start resetting your password</span>
						</span>
						<img class="option-arrow" src="../slike/arrow-right.svg" alt="" width="20" height="20">
					</button>

					<button class="recovery-option" type="button" popovertarget="demo-info" aria-labelledby="forgot-title" aria-describedby="forgot-description">
						<span class="option-text">
							<span class="option-title" id="forgot-title">I Forgot My Account</span>
							<span class="option-description" id="forgot-description">I don&rsquo;t remember the email or phone number I used for my Binance account. Click here to submit an appeal.</span>
						</span>
						<img class="option-arrow" src="../slike/arrow-right.svg" alt="" width="20" height="20">
					</button>
				</div>
			</section>
			<a class="register-txt" href="../index.html">Back to Log In</a>
		</div>
	</main>

	<footer class="page-footer">
		<div class="footer-links">
			<button class="language-button" type="button" popovertarget="demo-info">
				<img src="../slike/globe.svg" alt="" width="16" height="16"> English
			</button>
			<button type="button" popovertarget="demo-info">Cookies</button>
			<button type="button" popovertarget="demo-info">Privacy</button>
		</div>
	</footer>

	<aside class="demo-info" id="demo-info" popover lang="sl" aria-labelledby="demo-title">
		<h2 id="demo-title">Samo za prikaz</h2>
		<p>To je samo šolski primer. Tukaj ne moreš obnoviti računa ali zamenjati gesla.</p>
		<button type="button" popovertarget="demo-info" popovertargetaction="hide">Zapri</button>
	</aside>
</body>
</html>
